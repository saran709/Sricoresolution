  <body>
    <div id="root">
      <div id="boot-screen" role="status" aria-live="polite">
        <div>
          <div>Sricore Solutions</div>
          <p>Loading the engineering portal...</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showStartupError(message) {
          var screen = document.getElementById('boot-screen');
          if (!screen) return;
          var detail = document.createElement('p');
          detail.textContent = 'The application could not start. Please reload the page.';
          screen.replaceChildren(detail);
          console.error('Application startup error:', message);
        }

        window.addEventListener('error', function (event) {
          if (event.error || event.message) showStartupError(event.error || event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          showStartupError(event.reason || 'Unhandled promise rejection');
        });
      })();
    </script>

  </body>
